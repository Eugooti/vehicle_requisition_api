services:
  db:
    image: mysql:8.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DBNAME}
      MYSQL_ROOT_PASSWORD: ${DBPASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vehicle_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DBPASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  api:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - NODE_ENV=production
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/ebk"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - vehicle_net

networks:
  vehicle_net:
    driver: bridge

volumes:
  mysql_data:
