services:
  db:
    image: mysql:8.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DBNAME}
      MYSQL_ROOT_PASSWORD: ${DBPASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vehicle_net

  api:
    build: .
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - NODE_ENV=production
    ports:
      - "8080:8080"
    networks:
      - vehicle_net

networks:
  vehicle_net:
    driver: bridge

volumes:
  mysql_data:
